// Run this once to be able to run the application with BUCK
// puts all compile dependencies into folder libs for BUCK to use
task copyDownloadableDepsToLibs(type: Copy) {
    from configurations.compile
    into 'libs'
}

// Orion's native loader crashes if its model files are absent. These .iml files
// are runtime data, not IntelliJ modules; refuse to build a partial SDK bundle.
task verifyFaceModels {
    def manifestFile = file('src/main/face-models.json')
    inputs.file manifestFile
    inputs.dir file('src/main/assets')
    inputs.file file('libs/orion_vision.jar')
    inputs.file file('src/main/jniLibs/armeabi-v7a/liborionvision-lib.so')
    doLast {
        def manifest = new groovy.json.JsonSlurper().parse(manifestFile)
        def verifyFile = { File target, expectedHash, expectedSize ->
            if (!target.isFile() || (expectedSize != null && target.length() != expectedSize)) {
                throw new GradleException("Missing or incomplete face model/SDK file: ${target}")
            }
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            target.withInputStream { stream ->
                byte[] buffer = new byte[8192]
                int size
                while ((size = stream.read(buffer)) != -1) digest.update(buffer, 0, size)
            }
            if (digest.digest().encodeHex().toString() != expectedHash) {
                throw new GradleException("Face model/SDK checksum mismatch: ${target}")
            }
        }
        manifest.models.each { model ->
            verifyFile(file("src/main/assets/${model.file}"), model.sha256, model.size)
        }
        verifyFile(file("src/main/${manifest.nativeLibrary.file}"), manifest.nativeLibrary.sha256, null)
        verifyFile(file(manifest.jar.file), manifest.jar.sha256, null)
        logger.lifecycle("Verified ${manifest.models.size()} Orion face model assets and matching SDK")
    }
}
preBuild.dependsOn verifyFaceModels
