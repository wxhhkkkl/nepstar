<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>报告首页 · 宽松版预览</title>
  <style>
    :root{font-family:"PingFang SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#242735;background:#f1f2f5;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}a{color:inherit}
    .topbar{position:sticky;top:0;z-index:10;background:#fafafceF;backdrop-filter:blur(18px);border-bottom:1px solid #dde0e8;padding:20px 28px 16px}
    .top-inner{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
    h1{font-size:20px;font-weight:600;letter-spacing:-.4px;margin:0}h1 small{display:block;font-size:12px;letter-spacing:.4px;font-weight:400;color:#777b8b;margin-top:5px}
    .tabs{display:flex;padding:4px;gap:4px;background:#ececf2;border-radius:14px}
    .tab{border:0;background:transparent;padding:11px 18px;border-radius:10px;color:#737584;font-size:14px;white-space:nowrap;transition:background .15s,color .15s}
    .tab[aria-selected="true"]{background:#fff;color:#302c48;box-shadow:0 2px 7px #2924450d;font-weight:550}
    button:focus-visible,a:focus-visible{outline:3px solid #9683d1;outline-offset:3px}
    .swatch{display:inline-block;width:8px;height:8px;margin-right:7px;border-radius:50%;background:var(--swatch)}
    .toolbar{max-width:1100px;margin:18px auto 0;padding:0 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:12px;color:#757a89}
    .modes{display:flex;gap:6px}.mode{border:1px solid transparent;border-radius:8px;padding:8px 12px;background:transparent;color:#737887;font-size:13px}
    .mode[aria-pressed="true"]{background:#fff;color:#3b3a4b;border-color:#e1e2e9}
    .links{display:flex;gap:18px;align-items:center}.links a{text-decoration:none}.links a:hover{text-decoration:underline}
    main{padding:22px 24px 32px}.phone-stage{max-width:390px;margin:0 auto}
    .preview-window{width:100%;height:min(844px,calc(100dvh - 208px));min-height:400px;overflow:hidden;position:relative;background:#fff;border:1px solid #e0e2e7;box-shadow:0 12px 45px #252a3b0a;border-radius:4px}
    iframe{border:0;display:block;width:100%;height:100%}
    .replay{border:1px solid #ddd9e9;background:#fff;border-radius:8px;padding:8px 12px;color:#655880;font-size:13px}
    .hint{font-size:12px;line-height:1.7;color:#818695;text-align:center;margin:13px 0 0}
    .long-stage{max-width:780px;margin:0 auto}.long-stage img{width:100%;height:auto;display:block;border:1px solid #e0e2e7}
    [hidden]{display:none!important}.visually-hidden{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:680px){.topbar{padding:16px 16px 12px}.top-inner{gap:14px;justify-content:center}h1{text-align:center;font-size:18px}h1 small{font-size:11px}.tabs{width:100%;justify-content:center}.tab{padding:10px 9px;font-size:12px;flex:1}.toolbar{padding:0 14px;margin-top:12px;gap:10px;flex-wrap:wrap}.links{gap:12px;font-size:11px}.mode{padding:7px 10px;font-size:12px}main{padding:16px 14px 25px}.preview-window{height:min(844px,calc(100dvh - 245px));min-height:360px}}

    .toolbar,.modes,.links{flex-wrap:wrap}
    .phone-stage{width:100%;transition:max-width .2s ease}
    .preview-window{height:min(844px,calc(100dvh - 210px));min-height:400px}
    .hint{font-size:13px;line-height:1.75}
    @media(max-width:680px){.preview-window{height:calc(100dvh - 250px);min-height:350px}}
  </style>
</head>
<body>
  <header class="topbar"><div class="top-inner">
    <h1>报告首页 · 设计一览<small>宽松单列 / 7 个系统 / 25 项完整指标</small></h1>
    <nav class="tabs" role="tablist" aria-label="选择设计版本">
      <button class="tab" id="tab-light" role="tab" data-version="light" aria-selected="true" aria-controls="design-panel" style="--swatch:#8b78d4"><span class="swatch"></span>01 轻盈健康</button>
      <button class="tab" id="tab-gallery" role="tab" data-version="gallery" aria-selected="false" aria-controls="design-panel" tabindex="-1" style="--swatch:#c28d92"><span class="swatch"></span>02 器官画廊</button>
      <button class="tab" id="tab-data" role="tab" data-version="data" aria-selected="false" aria-controls="design-panel" tabindex="-1" style="--swatch:#8aa08b"><span class="swatch"></span>03 静谧数据</button>
    </nav>
  </div></header>
  <div class="toolbar">
    <div class="modes" aria-label="预览方式">
      <button class="mode" data-mode="phone" aria-pressed="true">手机预览</button>
      <button class="mode" id="width-toggle" type="button" aria-pressed="false">430px 宽屏</button>
    </div>
    <div class="links"><button class="replay" id="replay-motion" type="button">重播动画</button><a id="open-page" href="report-light.html?layout=airy-v4" target="_blank" rel="noopener">独立打开页面 ↗</a></div>
  </div>
  <main id="design-panel" role="tabpanel" aria-labelledby="tab-light">
    <div class="phone-stage" id="phone-stage">
      <div class="preview-window" id="preview-window"><iframe id="preview" src="report-light.html?layout=airy-v4" title="轻盈健康 · 完整手机报告预览"></iframe></div>
      <p class="hint">在预览内滚动查看全部指标<br>文字可直接阅读，图表随滚动绘制，AI 入口悬浮显示</p>
    </div>

    <p id="status" class="visually-hidden" role="status" aria-live="polite"></p>
  </main>
  <script defer src="airy-viewer.js?v=4"></script>
</body>
</html>
